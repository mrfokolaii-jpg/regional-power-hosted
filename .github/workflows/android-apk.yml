name: Build Android APK

on:
  push:
    branches:
      - arena/18e42b1c-regional-power-hosted
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out game source
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then SDK_ROOT=/usr/local/lib/android/sdk; fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "Installing Android command-line tools into $SDK_ROOT"
            mkdir -p "$SDK_ROOT/cmdline-tools" /tmp/android-cli
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cli/tools.zip
            unzip -q /tmp/android-cli/tools.zip -d /tmp/android-cli
            mv /tmp/android-cli/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          # sdkmanager terminates the license prompt itself; ignore only yes's expected SIGPIPE.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Build game and sync Android wrapper
        run: |
          npm run build
          npx cap sync android

      - name: Compile debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          result=${PIPESTATUS[0]}
          if [[ $result -ne 0 ]]; then
            tail -n 55 "$RUNNER_TEMP/gradle-build.log" >> "$GITHUB_STEP_SUMMARY"
            details=$(tail -n 12 "$RUNNER_TEMP/gradle-build.log" | sed 's/::/%3A%3A/g' | tr '\n' ' ' | cut -c1-1000)
            echo "::error title=Gradle build failed::$details"
            exit "$result"
          fi

      - name: Name APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Guardians-of-the-Plateau-Android.apk

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guardians-of-the-Plateau-Android-APK
          path: Guardians-of-the-Plateau-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK on the GitHub release page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: Android APK · latest build
          body: |
            Installable debug-signed APK built from the latest version of the Arena development branch.
            This is an original arcade beat-'em-up prototype. No Sega game code or assets are included.
          prerelease: true
          make_latest: false
          files: Guardians-of-the-Plateau-Android.apk
