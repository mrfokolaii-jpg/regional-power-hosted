name: Build Android APK

on:
  push:
    branches:
      - arena/18e42b1c-regional-power-hosted
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out game source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Build game and sync Android wrapper
        run: |
          npm run build
          npx cap sync android

      - name: Compile debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Guardians-of-the-Plateau-Android.apk

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guardians-of-the-Plateau-Android-APK
          path: Guardians-of-the-Plateau-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK on the GitHub release page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: Android APK · latest build
          body: |
            Installable debug-signed APK built from the latest version of the Arena development branch.
            This is an original arcade beat-'em-up prototype. No Sega game code or assets are included.
          prerelease: true
          make_latest: false
          files: Guardians-of-the-Plateau-Android.apk
