name: Build Android APK

on:
  push:
    branches:
      - arena/18e42b1c-regional-power-hosted
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out game source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "Android SDK manager not found at $SDKMANAGER" >&2
            find /usr/local/lib/android /opt -name sdkmanager -type f 2>/dev/null | head -20
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Build game and sync Android wrapper
        run: |
          npm run build
          npx cap sync android

      - name: Compile debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Guardians-of-the-Plateau-Android.apk

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guardians-of-the-Plateau-Android-APK
          path: Guardians-of-the-Plateau-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK on the GitHub release page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: Android APK · latest build
          body: |
            Installable debug-signed APK built from the latest version of the Arena development branch.
            This is an original arcade beat-'em-up prototype. No Sega game code or assets are included.
          prerelease: true
          make_latest: false
          files: Guardians-of-the-Plateau-Android.apk
